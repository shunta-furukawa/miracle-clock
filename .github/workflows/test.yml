name: Check game
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium webkit
      - name: Exercise desktop and iPhone-sized browsers
        run: node tests/browser.mjs
      - name: Verify offline app
        run: node tests/pwa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-browser-screenshots
          path: artifacts/
      - name: Preserve tested build
        uses: actions/upload-artifact@v4
        with:
          name: tested-game
          path: dist/
          if-no-files-found: error
          retention-days: 7
