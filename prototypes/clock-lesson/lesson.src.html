<title>空のとけい便</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* One storybook look on purpose: the forest depot, brass and the Miracle Mine gems. Colors are set explicitly for both host themes. */
:root{--paper:#fbf3df;--paper2:#f3e3bd;--ink:#2f3a33;--muted:#6f6a58;--brass:#b98a3e;--brass-d:#7a5725;--hour:#1f6f72;--minute:#c0592b;--good:#2f8a4f;--bad:#c0392b;--bg:#1d3a2c;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}
body{background:linear-gradient(#1d3a2cd0,#16301fee),var(--depot) center top/cover fixed,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #ffcf5a;outline-offset:3px}
.app{min-height:100vh;max-width:520px;margin:0 auto;padding:10px 16px 18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff6dc}
.top h1{font-size:15px;margin:0;font-weight:900;letter-spacing:.04em;text-align:center;flex:1;line-height:1.3}
.top h1 small{display:block;font-size:11px;font-weight:700;opacity:.8;letter-spacing:.12em}
.chip{border:1px solid #d9b56b;background:#fff6dc22;color:#fff6dc;border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;min-height:36px;white-space:nowrap}

/* Today's parcels: a box for each send, an envelope for each reply that turns into its gift. */
.parcels{display:flex;gap:4px;justify-content:center;align-items:center;min-height:28px}
.parcels i{font-style:normal;font-size:17px;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:#fff6dc22;opacity:.45}
.parcels i.done{opacity:1;background:#fff6dc44}
.parcels i.now{opacity:1;outline:2px solid #fff;outline-offset:1px}
.parcels i.gift{opacity:1;background:#ffe9a8;animation:pop .5s}
.parcels b{color:#fff6dc66;font-size:10px}

/* Toto talks from the counter. */
.toto-row{display:flex;align-items:flex-end;gap:6px;min-height:58px}
.toto-row img{width:58px;height:58px;object-fit:cover;object-position:50% 15%;border-radius:50%;background:#f3e3bd;border:2px solid #e2bf73;flex-shrink:0}
.bubble{position:relative;flex:1;background:#fffaf0;border:2px solid #e2bf73;border-radius:14px;padding:6px 10px;font-size:14px;font-weight:700;line-height:1.5}
.bubble::before{content:'';position:absolute;left:-9px;bottom:12px;border:8px solid transparent;border-right-color:#e2bf73;border-left:0}
.bubble b.h,.steps b.h{color:var(--hour)}.bubble b.m,.steps b.m{color:var(--minute)}

/* The customer at the counter with their parcel tag. */
.task{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--brass);border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 #0003}
.task img{width:62px;height:62px;object-fit:contain;flex-shrink:0}
.task .say{flex:1;min-width:0}
.task .who{font-size:12px;color:var(--muted);font-weight:700}
.task .line{font-size:15px;font-weight:700;line-height:1.45}
.tag{display:inline-flex;align-items:baseline;gap:2px;background:#fff8e6;border:2px solid var(--brass);border-radius:6px 14px 14px 6px;padding:2px 12px 2px 18px;font-size:26px;font-weight:900;margin-top:2px;letter-spacing:.02em;position:relative}
.tag::before{content:'';position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;border:2px solid var(--brass)}
.t-h{color:var(--hour)}.t-m{color:var(--minute)}
.task.arrive{animation:walkin .45s ease-out}
.task.leave{animation:walkout .5s ease-in forwards}
.task .thanks{font-size:18px;color:var(--good);font-weight:900}

/* The dial: twelve gem-coloured rooms, hour badge on the short hand, minute badge on the long one. */
.dial-wrap{position:relative;display:grid;place-items:center}
#dial{width:min(100%,370px);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:block;filter:drop-shadow(0 6px 10px #0006)}
#dial.drag{cursor:grabbing}
.rim{fill:#6b4a26;stroke:#e2bf73;stroke-width:3}
.minring{fill:#3b2a17}
.minnum{font-size:11px;font-weight:900;fill:#ffb07d;text-anchor:middle;dominant-baseline:central}
.minnum.on{fill:#fff;font-size:13px}
.mintick{stroke:#a07c4a;stroke-width:1}.mintick.big{stroke:#ffcf8a;stroke-width:2}
.face{fill:#fffaf0}
.room{stroke:#fff;stroke-width:1.2;transition:fill-opacity .25s}
.roomlabel{font-size:12px;font-weight:900;text-anchor:middle;dominant-baseline:central;fill:#0007;transition:opacity .25s}
.roomlabel.on{fill:#000c;font-size:15px}
.edge{stroke:#fff;stroke-width:2}
.hand-h{stroke:var(--hour);stroke-width:9;stroke-linecap:round}
.hand-m{stroke:var(--minute);stroke-width:5;stroke-linecap:round}
.badge circle{stroke:#fff;stroke-width:2.5}
.badge text{fill:#fff;font-size:12px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ghost line{stroke-dasharray:5 5;opacity:.7}
.pin{fill:#4a3417;stroke:#e2bf73;stroke-width:2}
.hidden{display:none}
.readout{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:30px}
.readout span{background:var(--paper);border-radius:14px;padding:3px 10px;font-size:14px;font-weight:900;border:2px solid transparent}
.readout .rh{border-color:var(--hour);color:var(--hour)}.readout .rm{border-color:var(--minute);color:var(--minute)}

/* Planes leave from the dial and come home to it. */
.plane{position:absolute;width:120px;pointer-events:none;z-index:5;left:50%;top:50%;margin:-40px 0 0 -60px;opacity:0}
.plane.go{animation:takeoff 1.3s ease-in forwards}
.plane.home{animation:landing 1.1s ease-out forwards}

/* The story: a flight to another island, and a letter that comes back. */
.task.story{background:linear-gradient(90deg,#fbf3dfee 25%,#fbf3dfc0 60%,#fbf3df66),var(--island) center/cover}
.task .item{font-size:13px;color:var(--brass-d);font-weight:700}
.letter{flex:1;min-width:0;background:#fffdf6;border:1.5px solid #e2bf73;border-radius:10px;padding:6px 10px;box-shadow:0 2px 0 #0001;position:relative}
.letter .from{font-size:11px;color:var(--muted);font-weight:700}
.letter .body{font-size:14px;font-weight:700;line-height:1.5}
.gift-pop{display:inline-block;font-size:30px;vertical-align:middle;animation:gift .7s cubic-bezier(.3,1.6,.5,1)}
.sparks{position:absolute;inset:0;pointer-events:none;z-index:6}
.sparks i{position:absolute;left:50%;top:50%;font-style:normal;font-size:20px;animation:spark .9s ease-out forwards}
@keyframes gift{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1)}}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1);opacity:0}}
.shelf{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0 0;padding:8px;background:#fff;border:2px dashed #e6d3a6;border-radius:14px}
.shelf i{font-style:normal;font-size:22px;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:#fdf6e4}
.shelf i.no{filter:grayscale(1) brightness(1.6);opacity:.35}
.shelf-title{text-align:center;font-size:12px;font-weight:700;color:var(--brass-d);margin-top:10px}

/* Answers. */
.actions{display:grid;gap:8px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{background:var(--paper);border:2px solid var(--brass);border-radius:14px;padding:6px 4px 8px;box-shadow:0 4px 0 #0003;display:grid;justify-items:center;gap:2px}
.choice .env{font-size:26px;line-height:1}
.choice small{font-size:11px;color:var(--muted);font-weight:700}
.choice>span{white-space:nowrap;font-size:17px;font-weight:900;background:#fff8e6;border:1.5px solid var(--brass);border-radius:4px 10px 10px 4px;padding:0 8px}
.choice>span.long{font-size:13px;padding:1px 5px}.choice>span.mid{font-size:15px}
.choice.right{background:#dff3e3;border-color:var(--good)}.choice.wrong{background:#fde2dc;border-color:var(--bad);opacity:.7}
.stamp{background:linear-gradient(#2a7a78,#1b5557);color:#fff6dc;border:2px solid #e2bf73;border-radius:16px;font-size:20px;font-weight:900;min-height:58px;box-shadow:0 4px 0 #0f3436}
.stamp:active{transform:translateY(2px);box-shadow:0 2px 0 #0f3436}
.helper{display:flex;justify-content:center;gap:10px}
.helper button{display:flex;align-items:center;gap:6px;background:#fff6dc1a;border:1px solid #fff6dc66;color:#fff6dc;border-radius:18px;padding:3px 12px 3px 4px;font-size:13px;font-weight:700;min-height:38px}
.helper img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#f3e3bd}

/* Toto's word after each parcel, reading each hand in turn. */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet[hidden]{display:none}
.sheet .card{width:100%;max-width:496px;background:var(--paper);border:3px solid var(--brass);border-radius:20px;padding:12px 14px;box-shadow:0 -6px 30px #0006;animation:up .25s ease-out;display:grid;grid-template-columns:52px 1fr;gap:4px 10px}
.sheet .card>img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#f3e3bd;border:2px solid #e2bf73}
.sheet .card>.body{min-width:0}
.sheet .name{font-size:11px;color:var(--muted);font-weight:700}
.sheet h2{margin:0 0 2px;font-size:20px;font-weight:900}
.sheet h2.ok{color:var(--good)}.sheet h2.ng{color:var(--bad)}
.steps{display:grid;gap:4px;margin:4px 0 8px;font-size:15px;font-weight:700;line-height:1.5}
.steps .sum{font-size:19px;font-weight:900}
.sheet .row{grid-column:1/-1;display:flex;gap:8px}.sheet .row button{flex:1}
.next{background:var(--hour);color:#fff;border:0;border-radius:14px;font-size:18px;font-weight:900;min-height:52px}
.again{background:#fff;border:2px solid var(--brass);border-radius:14px;font-size:16px;font-weight:900;min-height:52px}

/* The logbook of days and the end-of-day stamp. */
.overlay{position:fixed;inset:0;z-index:20;background:#12281cdd;display:grid;place-items:start center;overflow:auto;padding:16px}
.overlay[hidden]{display:none}
.panel{width:100%;max-width:480px;background:var(--paper);border:3px solid var(--brass);border-radius:22px;padding:0 0 16px;margin:auto 0;overflow:hidden}
.panel .inner{padding:0 16px}
.scene{height:130px;background:var(--depot) center 35%/cover;position:relative}
.scene img{position:absolute;right:10px;bottom:-6px;width:92px;filter:drop-shadow(0 4px 6px #0006)}
.scene .luka-plane{left:10px;right:auto;bottom:auto;top:12px;width:110px;animation:bob 3s ease-in-out infinite}
.panel h2{margin:12px 0 0;font-size:22px;font-weight:900;text-align:center}
.panel .eyebrow{display:block;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--brass-d);font-weight:700;margin-top:10px}
.panel p{font-size:14px;line-height:1.7;margin:8px 0}
.days{display:grid;gap:8px;margin-top:10px}
.day{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid #e6d3a6;border-radius:14px;padding:8px 10px}
.day b{font-size:16px}.day small{display:block;font-size:12px;color:var(--muted)}
.day .no{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;background:var(--hour);font-size:13px;line-height:1.1;text-align:center}
.day .st{color:#d09a1c;font-size:16px;letter-spacing:1px;white-space:nowrap}
.big-stars{font-size:44px;color:#e0a51f;text-align:center;letter-spacing:6px;margin:6px 0}
.legend{display:flex;justify-content:center;gap:14px;font-size:13px;font-weight:700;margin-top:6px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:22px;height:8px;border-radius:4px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes walkin{from{transform:translateX(60px);opacity:0}}
@keyframes walkout{to{transform:translateX(-80px);opacity:0}}
@keyframes takeoff{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}30%{opacity:1;transform:translate(20px,-20px) scale(.7) rotate(-8deg)}100%{opacity:0;transform:translate(260px,-260px) scale(1) rotate(-14deg)}}
@keyframes landing{0%{opacity:0;transform:translate(260px,-60px) scale(1) rotate(-6deg)}25%{opacity:1}100%{opacity:0;transform:translate(-110px,-230px) scale(.35) rotate(4deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop{animation:pop .35s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.plane{opacity:0!important}}

/* Sprites cut from the residents sheet. */
.portrait{width:62px;height:62px;flex-shrink:0;display:block}
.task .portrait{width:62px;height:62px}
/* Morning and afternoon: a window on the dial and a switch by the seal. */
.ampm-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ampm-pick button{background:var(--paper);border:2px solid var(--brass);border-radius:14px;min-height:44px;font-size:16px;font-weight:900}
.ampm-pick button[aria-pressed="true"]{background:#2a5d8a;color:#fff;border-color:#e2bf73}
.ampm-pick button[data-pm="0"][aria-pressed="true"]{background:#e3a321;color:#3b2a17}
.plate rect{fill:#fff8e6;stroke:#b98a3e;stroke-width:2}
.plate text{font-size:14px;font-weight:900;text-anchor:middle;dominant-baseline:central;fill:#2f3a33}
.now-ghost line{stroke:#6f6a58;stroke-dasharray:4 4;stroke-linecap:round;opacity:.85}
.sweep{fill:#ffcf5a;fill-opacity:.55;pointer-events:none}
.sweep.full{fill-opacity:.25}

/* The map of six depots and the central post they build together. */
.map-head{height:150px;background:var(--central) center 40%/cover;position:relative}
.map-head .toto-say{position:absolute;left:10px;right:86px;bottom:10px;background:#fffaf0ee;border:2px solid #e2bf73;border-radius:12px;padding:5px 9px;font-size:12.5px;font-weight:700;line-height:1.45}
.map-head img{position:absolute;right:6px;bottom:-4px;width:84px}
.prep{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0 2px}
.prep span{font-size:11px;font-weight:700;border-radius:10px;padding:3px 8px;background:#eee4cc;color:#8f8672}
.prep span.got{background:#2f8a4f;color:#fff}
.chapters{display:grid;gap:10px;margin-top:10px}
.chapter{border:2px solid color-mix(in srgb,var(--c) 60%,#e6d3a6);border-radius:16px;background:#fff;overflow:hidden}
.chapter-top{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(90deg,#fffffff0 55%,#ffffff99),var(--art) center/cover;border:0;width:100%;text-align:left}
.chapter-top .portrait{width:60px;height:60px}
.chapter-top b{font-size:16px;display:block}
.chapter-top small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.chapter-top i{font-style:normal;color:var(--c);font-size:11px;font-weight:900;letter-spacing:.1em}
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:8px 10px 10px}
.stage{border:2px solid #e6d3a6;background:#fffaf0;border-radius:10px;min-height:48px;padding:3px 0;display:grid;justify-items:center;align-content:center;gap:1px}
.stage b{font-size:13px}.stage small{font-size:9px;color:#d09a1c;letter-spacing:-1px}
.stage.cleared{background:color-mix(in srgb,var(--c) 18%,#fff);border-color:var(--c)}
.stage.next{outline:2px solid var(--c);outline-offset:1px}

/* Chapter dialogue. */
.talk{display:grid;gap:8px;margin:10px 0}
.talk .line{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:end}
.talk .line.me{grid-template-columns:1fr 52px}
.talk .line .portrait,.talk .line img{width:52px;height:52px;object-fit:contain}
.talk .say{background:#fff;border:2px solid #e6d3a6;border-radius:12px;padding:6px 10px;font-size:14px;font-weight:700;line-height:1.5}
.talk .say small{display:block;font-size:11px;color:var(--muted)}
.talk .me .say{background:#eef6f2;border-color:#a8cfc0}
.reward{margin:8px 0;padding:10px;border-radius:14px;background:#fff6dc;border:2px dashed var(--brass);text-align:center;font-weight:700;line-height:1.6}
.reward b{font-size:20px;display:block;color:var(--brass-d)}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><image id="atlas" width="1024" height="1536"/></defs></svg>
<main class="app" id="app">
 <header class="top">
  <button class="chip" id="menu-btn" type="button">🗺️ 地図</button>
  <h1 id="title">空のとけい便<small>LUCA &amp; TOTO'S AIR POST</small></h1>
  <button class="chip" id="voice-btn" type="button" aria-pressed="true">🔊 こえ</button>
 </header>
 <div class="parcels" id="parcels" aria-label="今日の荷物"></div>
 <div class="toto-row"><img id="toto-face" alt="トトじい"><div class="bubble" id="toto-say" aria-live="polite"></div></div>
 <section class="task" id="task" aria-live="polite"></section>
 <div class="dial-wrap"><svg id="dial" viewBox="-160 -160 320 320" role="img" aria-label="魔法の時計"></svg><img class="plane" id="plane" alt=""></div>
 <div class="readout" id="readout" aria-live="polite"></div>
 <div class="actions" id="actions"></div>
 <div class="helper"><button type="button" id="hint-btn"><img id="hint-face" alt="">トトじいに聞く</button></div>
</main>

<div class="sheet" id="sheet" hidden><div class="card" id="sheet-card"></div></div>

<div class="overlay" id="menu">
 <div class="panel">
  <div class="map-head"><p class="toto-say" id="map-say"></p><img id="map-toto" alt="トトじい"></div>
  <div class="inner">
   <span class="eyebrow">THE JOURNEY TO CENTRAL AIR POST</span>
   <h2>6つの配送所をひらこう</h2>
   <div class="prep" id="prep"></div>
   <div class="chapters" id="chapters"></div>
   <div id="menu-shelf"></div>
   <p style="font-size:12px;color:var(--muted);text-align:center">お客さんは急がないよ。ゆっくり針を合わせてね。</p>
  </div>
 </div>
</div>

<div class="overlay" id="result" hidden>
 <div class="panel" id="result-panel"></div>
</div>

<script>
const GEM_IMG=__GEMS__;      // index 1..12 → gem artwork with its numeral
const ART=__ART__;           // {toto,plane,luka,atlas,central,islands[6]}
// Miracle Mine gem colours; index is the hour (12 uses index 0).
const GEM=['#eee9dc','#1468c1','#f1c84a','#c24627','#087c61','#b96a11','#9cdbeb','#343e89','#b64276','#b3a1e6','#83cfb5','#dc9656'];
const HOUR='#1f6f72',MINUTE='#c0592b';
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const hourOf=t=>Math.floor(((t%720)+720)%720/60)||12;
const minOf=t=>((Math.round(t)%60)+60)%60;
const ms=t=>(((t%720)+720)%720);
const nextH=h=>h%12+1,prevH=h=>(h+10)%12+1;
const FIVES=[5,10,15,20,25,30,35,40,45,50,55],ONES=Array.from({length:60},(_,i)=>i).filter(i=>i%5);
document.documentElement.style.setProperty('--depot',`url(${ART.islands[0]})`);
document.documentElement.style.setProperty('--central',`url(${ART.central})`);
document.getElementById('atlas').setAttribute('href',ART.atlas);
for(const id of ['toto-face','hint-face','map-toto'])$(id).src=ART.toto;
$('plane').src=ART.plane;

// ---------- the six depots (same order and stage names as the main game) ----------
// Sprite boxes in queue-residents.webp: [region][column], column 0 is the depot's guide.
const BOX=[[[26,12,228,250],[300,46,170,218],[530,10,208,254],[776,14,232,250]],[[32,268,224,226],[292,278,184,218],[514,272,224,226],[784,272,216,228]],[[16,498,240,230],[284,534,196,194],[500,502,238,228],[770,502,238,228]],[[18,736,254,228],[290,788,194,176],[490,734,252,232],[756,738,258,228]],[[10,972,258,236],[288,1004,200,206],[506,976,246,234],[768,972,244,236]],[[20,1216,248,296],[294,1228,194,282],[520,1222,246,290],[786,1216,228,296]]];

// ---------- time words ----------
const minWord=m=>m?`${m}分`:'ちょうど';
const durWord=d=>d>=60?`${Math.floor(d/60)}時間${d%60?`${d%60}分`:''}`:`${d}分`;
function hourWord(h,p,c=cfg){if(c.period==='24')return `${h%12+(p?12:0)}`;if(c.period)return `${p?'午後':'午前'}${h===12?0:h}`;return `${h}`;}
// A time as a coloured label: hour part teal, minute part orange.
function label(h,m,p,half=false,c=cfg){
 if(c.mode==='min')return `<span class="t-m">${minWord(m)}</span>`;
 const mm=m===0?(c.period?'':'<span class="t-m">ちょうど</span>'):m===30&&half?'<span class="t-m">半</span>':`<span class="t-m">${m}分</span>`;

 if(read){
  const third=c.period?{h,m,p:!p}:m%5===0&&m>0?{h,m:m/5,p}:m===0?{h:prevH(h),m,p}:{h,m:m-m%5,p};

// ---------- the dial ----------
const P=(deg,r)=>[Math.sin(deg*Math.PI/180)*r,-Math.cos(deg*Math.PI/180)*r];

function buildDial(){
 let s=`<circle r="156" class="rim"/><circle r="146" class="minring"/><path id="sweep-full" class="sweep full hidden" d="${band(0,359.9,127,146)}"/><path id="sweep" class="sweep"/>`;
 for(let i=0;i<60;i++){const big=i%5===0,[x0,y0]=P(i*6,big?128:133),[x1,y1]=P(i*6,145);s+=`<line class="mintick${big?' big':''}" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`;}
 s+=`<g id="minnums">`;for(let i=0;i<12;i++){const [x,y]=P(i*30,137);s+=`<text class="minnum" data-min="${i*5}" x="${x}" y="${y}">${i*5}</text>`;}s+=`</g>`;
 s+=`<circle r="126" class="face"/><g id="rooms">`;
 for(let n=0;n<12;n++){s+=`<path class="room" data-room="${n}" d="${wedge(n*30,n*30+30,125)}" fill="${GEM[n]}" fill-opacity=".22"/>`;}
 s+=`</g><g id="edges">`;for(let n=0;n<12;n++){const [x0,y0]=P(n*30,20),[x1,y1]=P(n*30,125);s+=`<line class="edge" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`;}s+=`</g>`;
 s+=`<g id="roomlabels">`;for(let n=0;n<12;n++){const [x,y]=P(n*30+15,72);s+=`<text class="roomlabel" data-room="${n}" x="${x}" y="${y}">${n||12}</text>`;}s+=`</g>`;
 for(let n=1;n<=12;n++){const [x,y]=P(n*30,104);s+=`<image href="${GEM_IMG[n]}" x="${x-17}" y="${y-17}" width="34" height="34"/>`;}
 s+=`<g id="plate" class="plate hidden" transform="translate(0 44)"><rect x="-34" y="-13" width="68" height="26" rx="8"/><text id="plate-text">午前</text></g>`;
 s+=`<g id="nowg" class="now-ghost hidden"><line id="nh" x1="0" y1="0" x2="0" y2="-58" stroke-width="7"/><line id="nm" x1="0" y1="0" x2="0" y2="-110" stroke-width="4"/></g>`;
 s+=`<g id="ghost" class="ghost hidden"><line id="gh" class="hand-h" x1="0" y1="0" x2="0" y2="-62" stroke="${HOUR}"/><line id="gm" class="hand-m" x1="0" y1="0" x2="0" y2="-112" stroke="${MINUTE}"/></g>`;
 s+=`<g id="hm"><line class="hand-m" x1="0" y1="14" x2="0" y2="-112"/><g class="badge" transform="translate(0 -100)"><circle r="11" fill="${MINUTE}"/><text>分</text></g></g>`;
 s+=`<g id="hh"><line class="hand-h" x1="0" y1="10" x2="0" y2="-60"/><g class="badge" transform="translate(0 -50)"><circle r="13" fill="${HOUR}"/><text>時</text></g></g>`;
 s+=`<circle r="7" class="pin"/>`;
 $('dial').innerHTML=s;
}
const showHour=()=>cfg.mode!=='min',showMin=()=>cfg.mode!=='room';
const elapsed=()=>q&&q.mode==='rel'?ms(t-q.now):0;

// Drag the hand you grab: near the centre it is the short hand, further out the long hand.
function angleOf(e){const b=$('dial').getBoundingClientRect(),x=e.clientX-b.left-b.width/2,y=e.clientY-b.top-b.height/2;return {a:(Math.atan2(x,-y)*180/Math.PI+360)%360,r:Math.hypot(x,y)/(b.width/2)*160};}
$('dial').addEventListener('pointerdown',e=>{

 let hand=cfg.drag;if(hand==='both')hand=r<72?'hour':'minute';
 drag={hand,last:a};$('dial').setPointerCapture(e.pointerId);$('dial').classList.add('drag');move(a);
});
$('dial').addEventListener('pointermove',e=>{if(drag)move(angleOf(e).a);});
const end=()=>{if(!drag)return;drag=null;$('dial').classList.remove('drag');

$('dial').addEventListener('pointerup',end);$('dial').addEventListener('pointercancel',end);
function move(a){
 const before=t;
 if(drag.hand==='hour'){
  if(cfg.exact)t=Math.floor(a/30)*60;                   // snaps into a room at "ちょうど"
  else if(cfg.mode==='room')t=a*2;                        // the short hand alone glides freely
  else t=Math.floor(a/30)*60+minOf(t);                    // keep the minutes, change the room
 }else{let d=a-drag.last;if(d>180)d-=360;if(d<-180)d+=360;t=ms(t+d/6);}  // the long hand pulls the short hand along

 draw();
}

// ---------- a working day: three sends, three replies ----------
const tagOf=q=>q.mode==='min'?`<span class="t-m">${q.m}分</span>`:q.mode==='room'?`<span class="t-h">${q.h}時</span>ごろ`:q.mode==='rel'?`いまから <span class="t-m">${durWord(q.d)}後</span>`:label(q.h,q.m,q.p,q.half);
const spokenTag=q=>q.mode==='min'?`${q.m}ふん`:q.mode==='room'?`${q.h}じごろ`:q.mode==='rel'?`いまから ${durWord(q.d).replace('時間','じかん').replace('分','ふん')}ご`:spoken(q.h,q.m,q.p,q.half);
function startStage(c,n){
 ci=c;si=n;stage=CH[c].stages[n];cfg=stage.cfg;qi=0;mistakes=0;hints=0;results=[];gotToday=[];$('menu').hidden=true;$('result').hidden=true;
 document.documentElement.style.setProperty('--depot',`url(${ART.islands[ART_OF[c]]})`);
 // Senders are this depot's guide and residents; unseen gifts come first.
 const senders=shuffle([0,1,2,3]).map(col=>person(c,col)),all=CH[c].stories.map(([item,what,to,reply,gift,giftName])=>({item,what,to,reply,gift,giftName}));
 tales=[...shuffle(all.filter(x=>!rec.gifts.includes(x.gift))),...shuffle(all.filter(x=>rec.gifts.includes(x.gift)))].slice(0,3).map((x,k)=>({...x,who:senders[k]}));

function ask(first=false){

 sheet('おっと、まだ飛ばせんぞ',`<div>${why}</div>${tries>=2?'<div>点線の針のところに、わしが印をつけておいたぞ。</div>':''}`,'もういちど','ng');
 $('sheet-go').onclick=()=>{$('sheet').hidden=true;};say(tries>=2?'てんせんの はりを みてごらん':'おっと、もういちど');
}
function choose(b){
 if(answered)return;const ok=b.dataset.key===q.answer;tries++;
 if(ok){b.classList.add('right');finishQ();return;}
 mistakes++;b.classList.add('wrong');b.disabled=true;tone(200,.2,.08);
 const [hh,,pp]=b.dataset.key.split(':');
 let why='';
 if(q.mode==='room')why=`時の針は、宝石の <b class="h">${q.h}</b> と <b class="h">${nextH(q.h)}</b> のあいだ。<b class="h">${q.h}のへや</b>の色を見てごらん。`;
 else if(q.mode==='min')why=q.m%5===0?`分の針がさす外の数字を見るんじゃ。宝石の <b class="m">${q.m?q.m/5:12}</b> のところは <b class="m">${minWord(q.m)}</b>じゃよ。`:`分の針は <b class="m">${q.m-q.m%5}</b> から 目もり<b class="m">${q.m%5}</b>つ すすんだところじゃ。`;
 else if(q.mode==='rel')why=`点線の分の針から、ふつうの分の針まで 数えてごらん。数字ひとつで<b class="m">5分</b>、ひとまわりで<b class="m">1時間</b>じゃ。`;
 else if(cfg.period&&pp!==String(q.p))why=`時計の窓を見てごらん。<b>${q.p?'午後':'午前'}</b>と書いてあるぞ。`;
 else if(Number(hh)!==q.h)why=`時の針は、まだ <b class="h">${nextH(q.h)}</b> をこえておらん。<b class="h">${q.h}のへや</b>におるのう。`;
 else why=`分の針は外の数字で読むんじゃ。<b class="m">${q.m?(q.m%5?`${Math.floor(q.m/5)}と目もり${q.m%5}つ`:q.m/5):12}</b> のところは <b class="m">${minWord(q.m)}</b>。`;
 sheet(q.mode==='rel'?'その時間じゃないみたい':'この封筒じゃないみたい',`<div>${why}</div>`,'もういちど えらぶ','ng');
 $('sheet-go').onclick=()=>{$('sheet').hidden=true;};say('おっと、ちがうみたい');
}
function finishQ(){
 answered=true;results[qi]=tries===1&&!helped;draw();tone(880,.12);setTimeout(()=>tone(1320,.18),120);
 const tale=q.tale,to=CH[tale.to],last=qi+1>=6,task=$('task');
 if(q.read){
  // The letter opens: the friend's reply and a gift for the treasure shelf.
  gotToday.push(tale.gift);const isNew=!rec.gifts.includes(tale.gift);if(isNew){rec.gifts.push(tale.gift);save();}
  task.innerHTML=`${portrait(tale.who)}<div class="letter"><div class="from">✉️ ${to.place}の${to.guide}より</div><div class="body">${tale.reply}</div><div class="thanks"><span class="gift-pop">${tale.gift}</span> ${tale.giftName}${isNew?' <small style="color:#c08a1c">NEW!</small>':''}</div></div>`;
  burst([tale.gift,'✨']);setTimeout(()=>tone(1568,.2,.05),260);
  sheet(`${tale.who.name}に おへんじを わたしたぞ！`,steps(t),last?'今日の日誌をつける':'つぎのお客さん','ok');
  say(`${to.guide}から、${tale.giftName}が とどいたよ！`);
 }else{
  fly('go');burst(['✨','⭐']);
  task.classList.add('story');task.style.setProperty('--island',`url(${ART.islands[ART_OF[tale.to]]})`);
  task.innerHTML=`${portrait(tale.who)}<div class="say"><div class="who">${tale.who.name}</div><div class="item">✈️ ${tale.item} ${tale.what}は ${to.place}へ</div><div class="thanks">いってらっしゃーい！</div></div>`;
  sheet(`ぴったりじゃ！ ${to.place}まで飛んでいけ〜`,steps(t),'おへんじを まつ ✉️','ok');
  say('いってらっしゃい！');
 }
 parcels();
 $('sheet-go').onclick=()=>{qi++;task.classList.add('leave');setTimeout(()=>{if(qi<6)ask();else finishStage();},q.read?350:0);};
}
function sheet(title,body,go,cls=''){
 $('sheet-card').innerHTML=`<img src="${ART.toto}" alt=""><div class="body"><div class="name">トトじい</div><h2 class="${cls}">${title}</h2><div class="steps">${body}</div></div><div class="row"><button class="${cls==='ok'?'next':'again'}" id="sheet-go" type="button">${go}</button></div>`;
 $('sheet').hidden=false;$('sheet-go').focus();
}
const allGifts=()=>CH.flatMap(c=>c.stories.map(s=>({gift:s[4],name:s[5]})));
const shelfMarkup=()=>{const g=allGifts();return `<div class="shelf-title">たからだな ${rec.gifts.length} / ${g.length}</div><div class="shelf">${g.map(x=>`<i class="${rec.gifts.includes(x.gift)?'':'no'}" title="${rec.gifts.includes(x.gift)?x.name:'？'}">${rec.gifts.includes(x.gift)?x.gift:'？'}</i>`).join('')}</div>`;};
const chapterDone=c=>[0,1,2,3,4,5].every(n=>rec.stars[sid(c,n)]);
function finishStage(){
 const lost=mistakes+hints,stars=lost===0?3:lost<=2?2:1,id=sid(ci,si);rec.stars[id]=Math.max(rec.stars[id]||0,stars);
 const newReward=chapterDone(ci)&&!rec.rewards.includes(ci);if(newReward)rec.rewards.push(ci);save();
 $('sheet').hidden=true;
 const next=id+1<36?[Math.floor((id+1)/6),(id+1)%6]:null;
 $('result-panel').innerHTML=`<div class="scene" style="--depot:url(${ART.islands[ART_OF[ci]]})"><img class="luka-plane" src="${ART.plane}" alt=""><img src="${ART.toto}" alt=""></div><div class="inner"><span class="eyebrow">${CH[ci].name} ・ ${ci+1}-${si+1} ${stage.title}</span><h2>今日の配達、おしまい！</h2><div class="big-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p style="text-align:center">3つの荷物をとどけて、3通のおへんじが来たよ<br><span style="font-size:30px">${gotToday.join(' ')}</span></p><p style="text-align:center;font-weight:700">トトじい「${stars===3?'見事じゃ！ 時の針と分の針、すっかり仲良しじゃのう。':stars===2?'よう届けたのう。針の係、だいぶ見えてきたぞ。':'今日もよう働いた！ 明日もいっしょに届けような。'}」</p><div class="days"><button class="next" id="again-d" type="button">もういちど</button>${next?`<button class="next" id="next-d" type="button" style="background:${MINUTE}">${next[0]+1}-${next[1]+1} へ ▸</button>`:''}<button class="again" id="list-d" type="button">地図にもどる</button></div></div>`;
 $('result').hidden=false;$('again-d').onclick=()=>startStage(ci,si);$('list-d').onclick=showMenu;if(next)$('next-d').onclick=()=>openStage(next[0],next[1]);
 say(stars===3?'みごとじゃ！':'よう とどけたのう');
 if(newReward)setTimeout(()=>chapterEnd(ci),50);
}
// Chapter story: the guide's request when a depot opens, and their gift to the central post at the end.
function talkMarkup(c,lines){const g=person(c,0);return `<div class="talk">${lines.map(([me,text])=>me?`<div class="line me"><div class="say"><small>ルカ</small>${text}</div><img src="${ART.luka}" alt="ルカ"></div>`:`<div class="line">${portrait(g)}<div class="say"><small>${g.name}</small>${text}</div></div>`).join('')}</div>`;}
function chapterStart(c,then){
 const ch=CH[c];if(!rec.met.includes(c)){rec.met.push(c);save();}
 $('result-panel').innerHTML=`<div class="scene" style="--depot:url(${ART.islands[ART_OF[c]]})"><img src="${ART.toto}" alt=""></div><div class="inner"><span class="eyebrow">CHAPTER ${c+1} ・ ${ch.place}</span><h2>${ch.name}、開店！</h2>${talkMarkup(c,[[0,ch.talk[0]],[1,ch.talk[1]],[0,ch.talk[2]]])}<p style="text-align:center;font-size:13px;color:var(--muted)">この章で練習：${ch.skill}</p><div class="days"><button class="next" id="go-d" type="button">受付をはじめる ▸</button></div></div>`;
 $('result').hidden=false;$('menu').hidden=true;$('go-d').onclick=then;
}
function chapterEnd(c){
 const ch=CH[c],n=rec.rewards.length;
 $('result-panel').innerHTML=`<div class="scene" style="--depot:url(${ART.central})"><img class="luka-plane" src="${ART.plane}" alt=""><img src="${ART.toto}" alt=""></div><div class="inner"><span class="eyebrow">${ch.name} ・ 6便 ぜんぶ達成</span><h2>ありがとうの便</h2>${talkMarkup(c,[[0,ch.end[0]],[1,ch.end[1]]])}<div class="reward">中央配送所へ<b>${ch.reward}</b>${ch.thanks}<br><small>中央配送所のしたく ${n} / 6</small></div><div class="days"><button class="next" id="map-d" type="button">地図にもどる</button></div></div>`;
 $('map-d').onclick=showMenu;tone(660,.12);setTimeout(()=>tone(990,.2),140);
}
function openStage(c,n){if(n===0&&!rec.met.includes(c))chapterStart(c,()=>startStage(c,n));else startStage(c,n);}
$('hint-btn').onclick=()=>{
 if(!q||answered)return;hints++;helped=true;
 if(q.read)sheet('どれ、わしが見てみよう',q.mode==='rel'?'<div>点線の分の針から、数字をひとつずつ数えてごらん。数字ひとつで5分じゃ。</div>':`${showHour()?`<div><b class="h">時の針</b>がいる宝石のへやを見るんじゃ。宝石の数字から、つぎの宝石までがひとつのへや。</div>`:''}${showMin()?`<div><b class="m">分の針</b>は外がわの数字を読む。5、10、15…とな。</div>`:''}${cfg.period?'<div>午前か午後かは、時計の<b>窓</b>に書いてあるぞ。</div>':''}`,'わかった！');
 else{ghost=ghostTime();draw();sheet('どれ、わしが印をつけよう',`<div>点線の針のところに合わせてごらん。${cfg.period?`窓は <b>${q.p?'午後':'午前'}</b>じゃ。`:''}</div>`,'わかった！');}
 $('sheet-go').onclick=()=>{$('sheet').hidden=true;};
};
function showMenu(){
 $('result').hidden=true;$('sheet').hidden=true;
 const n=rec.rewards.length,nextId=Array.from({length:36},(_,i)=>i).find(i=>!rec.stars[i]);
 $('map-say').innerHTML=n===6?'6つの贈り物がそろった！ みんなの中央配送所、開所じゃ！':`トトじい「島をめぐって配送所をひらき、みんなで<b>空の中央配送所</b>をつくるんじゃ。」`;
 $('prep').innerHTML=CH.map((c,i)=>`<span class="${rec.rewards.includes(i)?'got':''}">${rec.rewards.includes(i)?'✓ ':''}${c.reward}</span>`).join('');
 $('chapters').innerHTML=CH.map((ch,c)=>`<article class="chapter" style="--c:${ch.color};--art:url(${ART.islands[ART_OF[c]]})"><button class="chapter-top" type="button" data-talk="${c}">${portrait(person(c,0))}<span><i>CHAPTER ${c+1} ・ ${ch.skill}</i><b>${ch.name}</b><small>${ch.place} ・ ${ch.guide}とみんな ・ 中央へ「${ch.reward}」</small></span></button><div class="stages">${ch.stages.map((s,k)=>{const id=sid(c,k),st=rec.stars[id]||0;return `<button class="stage ${st?'cleared':id===nextId?'next':''}" type="button" data-c="${c}" data-n="${k}" aria-label="${c+1}-${k+1} ${s.title}"><b>${c+1}-${k+1}</b><small>${'★'.repeat(st)}${'☆'.repeat(3-st)}</small></button>`;}).join('')}</div></article>`).join('');
 for(const b of document.querySelectorAll('.stage'))b.onclick=()=>openStage(Number(b.dataset.c),Number(b.dataset.n));
 for(const b of document.querySelectorAll('[data-talk]'))b.onclick=()=>{const c=Number(b.dataset.talk);chapterStart(c,()=>startStage(c,0));};
 $('menu-shelf').innerHTML=shelfMarkup();
 $('menu').hidden=false;
}
$('menu-btn').onclick=showMenu;
cfg=CH[0].stages[0].cfg;buildDial();t=3*60+50;draw();showMenu();
</script>
