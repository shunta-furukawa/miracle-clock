<title>森の配送所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* One storybook look on purpose: the forest depot, brass and the Miracle Mine gems. Colors are set explicitly for both host themes. */
:root{--paper:#fbf3df;--paper2:#f3e3bd;--ink:#2f3a33;--muted:#6f6a58;--brass:#b98a3e;--brass-d:#7a5725;--hour:#1f6f72;--minute:#c0592b;--good:#2f8a4f;--bad:#c0392b;--bg:#1d3a2c;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}
body{background:linear-gradient(#1d3a2cd0,#16301fee),var(--depot) center top/cover fixed,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #ffcf5a;outline-offset:3px}
.app{min-height:100vh;max-width:520px;margin:0 auto;padding:10px 16px 18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff6dc}
.top h1{font-size:15px;margin:0;font-weight:900;letter-spacing:.04em;text-align:center;flex:1;line-height:1.3}
.top h1 small{display:block;font-size:11px;font-weight:700;opacity:.8;letter-spacing:.12em}
.chip{border:1px solid #d9b56b;background:#fff6dc22;color:#fff6dc;border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;min-height:36px;white-space:nowrap}

/* Today's parcels: one box per customer, stamped when delivered. */
.parcels{display:flex;gap:6px;justify-content:center}
.parcels i{width:22px;height:18px;border-radius:4px;background:#c9a877;border:1px solid #7a5725;position:relative;opacity:.55;font-style:normal;font-size:11px;line-height:17px;text-align:center;color:#fff}
.parcels i::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #8a6231}
.parcels i.done{opacity:1;background:#e9c98f}.parcels i.done::after{content:'✓';position:relative;font-weight:900;color:var(--good)}
.parcels i.help{opacity:1;background:#e9c98f}.parcels i.help::after{content:'✓';position:relative;font-weight:900;color:#c08a1c}
.parcels i.now{opacity:1;outline:2px solid #fff;outline-offset:2px}

/* Toto talks from the counter. */
.toto-row{display:flex;align-items:flex-end;gap:6px;min-height:58px}
.toto-row img{width:58px;height:58px;object-fit:cover;object-position:50% 15%;border-radius:50%;background:#f3e3bd;border:2px solid #e2bf73;flex-shrink:0}
.bubble{position:relative;flex:1;background:#fffaf0;border:2px solid #e2bf73;border-radius:14px;padding:6px 10px;font-size:14px;font-weight:700;line-height:1.5}
.bubble::before{content:'';position:absolute;left:-9px;bottom:12px;border:8px solid transparent;border-right-color:#e2bf73;border-left:0}
.bubble b.h,.steps b.h{color:var(--hour)}.bubble b.m,.steps b.m{color:var(--minute)}

/* The customer at the counter with their parcel tag. */
.task{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--brass);border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 #0003}
.task img{width:62px;height:62px;object-fit:contain;flex-shrink:0}
.task .say{flex:1;min-width:0}
.task .who{font-size:12px;color:var(--muted);font-weight:700}
.task .line{font-size:15px;font-weight:700;line-height:1.45}
.tag{display:inline-flex;align-items:baseline;gap:2px;background:#fff8e6;border:2px solid var(--brass);border-radius:6px 14px 14px 6px;padding:2px 12px 2px 18px;font-size:26px;font-weight:900;margin-top:2px;letter-spacing:.02em;position:relative}
.tag::before{content:'';position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;border:2px solid var(--brass)}
.t-h{color:var(--hour)}.t-m{color:var(--minute)}
.task.arrive{animation:walkin .45s ease-out}
.task.leave{animation:walkout .5s ease-in forwards}
.task .thanks{font-size:18px;color:var(--good);font-weight:900}

/* The dial: twelve gem-coloured rooms, hour badge on the short hand, minute badge on the long one. */
.dial-wrap{position:relative;display:grid;place-items:center}
#dial{width:min(100%,370px);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:block;filter:drop-shadow(0 6px 10px #0006)}
#dial.drag{cursor:grabbing}
.rim{fill:#6b4a26;stroke:#e2bf73;stroke-width:3}
.minring{fill:#3b2a17}
.minnum{font-size:11px;font-weight:900;fill:#ffb07d;text-anchor:middle;dominant-baseline:central}
.minnum.on{fill:#fff;font-size:13px}
.mintick{stroke:#a07c4a;stroke-width:1}.mintick.big{stroke:#ffcf8a;stroke-width:2}
.face{fill:#fffaf0}
.room{stroke:#fff;stroke-width:1.2;transition:fill-opacity .25s}
.roomlabel{font-size:12px;font-weight:900;text-anchor:middle;dominant-baseline:central;fill:#0007;transition:opacity .25s}
.roomlabel.on{fill:#000c;font-size:15px}
.edge{stroke:#fff;stroke-width:2}
.hand-h{stroke:var(--hour);stroke-width:9;stroke-linecap:round}
.hand-m{stroke:var(--minute);stroke-width:5;stroke-linecap:round}
.badge circle{stroke:#fff;stroke-width:2.5}
.badge text{fill:#fff;font-size:12px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ghost line{stroke-dasharray:5 5;opacity:.7}
.pin{fill:#4a3417;stroke:#e2bf73;stroke-width:2}
.hidden{display:none}
.readout{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:30px}
.readout span{background:var(--paper);border-radius:14px;padding:3px 10px;font-size:14px;font-weight:900;border:2px solid transparent}
.readout .rh{border-color:var(--hour);color:var(--hour)}.readout .rm{border-color:var(--minute);color:var(--minute)}

/* Planes leave from the dial and come home to it. */
.plane{position:absolute;width:120px;pointer-events:none;z-index:5;left:50%;top:50%;margin:-40px 0 0 -60px;opacity:0}
.plane.go{animation:takeoff 1.3s ease-in forwards}
.plane.home{animation:landing 1.1s ease-out forwards}

/* Answers. */
.actions{display:grid;gap:8px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{background:var(--paper);border:2px solid var(--brass);border-radius:14px;padding:6px 4px 8px;box-shadow:0 4px 0 #0003;display:grid;justify-items:center;gap:2px}
.choice img{width:48px;height:48px;object-fit:contain}
.choice small{font-size:11px;color:var(--muted);font-weight:700}
.choice span{font-size:18px;font-weight:900;background:#fff8e6;border:1.5px solid var(--brass);border-radius:4px 10px 10px 4px;padding:0 8px}
.choice.right{background:#dff3e3;border-color:var(--good)}.choice.wrong{background:#fde2dc;border-color:var(--bad);opacity:.7}
.stamp{background:linear-gradient(#2a7a78,#1b5557);color:#fff6dc;border:2px solid #e2bf73;border-radius:16px;font-size:20px;font-weight:900;min-height:58px;box-shadow:0 4px 0 #0f3436}
.stamp:active{transform:translateY(2px);box-shadow:0 2px 0 #0f3436}
.helper{display:flex;justify-content:center;gap:10px}
.helper button{display:flex;align-items:center;gap:6px;background:#fff6dc1a;border:1px solid #fff6dc66;color:#fff6dc;border-radius:18px;padding:3px 12px 3px 4px;font-size:13px;font-weight:700;min-height:38px}
.helper img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#f3e3bd}

/* Toto's word after each parcel, reading each hand in turn. */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet[hidden]{display:none}
.sheet .card{width:100%;max-width:496px;background:var(--paper);border:3px solid var(--brass);border-radius:20px;padding:12px 14px;box-shadow:0 -6px 30px #0006;animation:up .25s ease-out;display:grid;grid-template-columns:52px 1fr;gap:4px 10px}
.sheet .card>img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#f3e3bd;border:2px solid #e2bf73}
.sheet .card>.body{min-width:0}
.sheet .name{font-size:11px;color:var(--muted);font-weight:700}
.sheet h2{margin:0 0 2px;font-size:20px;font-weight:900}
.sheet h2.ok{color:var(--good)}.sheet h2.ng{color:var(--bad)}
.steps{display:grid;gap:4px;margin:4px 0 8px;font-size:15px;font-weight:700;line-height:1.5}
.steps .sum{font-size:19px;font-weight:900}
.sheet .row{grid-column:1/-1;display:flex;gap:8px}.sheet .row button{flex:1}
.next{background:var(--hour);color:#fff;border:0;border-radius:14px;font-size:18px;font-weight:900;min-height:52px}
.again{background:#fff;border:2px solid var(--brass);border-radius:14px;font-size:16px;font-weight:900;min-height:52px}

/* The logbook of days and the end-of-day stamp. */
.overlay{position:fixed;inset:0;z-index:20;background:#12281cdd;display:grid;place-items:start center;overflow:auto;padding:16px}
.overlay[hidden]{display:none}
.panel{width:100%;max-width:480px;background:var(--paper);border:3px solid var(--brass);border-radius:22px;padding:0 0 16px;margin:auto 0;overflow:hidden}
.panel .inner{padding:0 16px}
.scene{height:130px;background:var(--depot) center 35%/cover;position:relative}
.scene img{position:absolute;right:10px;bottom:-6px;width:92px;filter:drop-shadow(0 4px 6px #0006)}
.scene .luka-plane{left:10px;right:auto;bottom:auto;top:12px;width:110px;animation:bob 3s ease-in-out infinite}
.panel h2{margin:12px 0 0;font-size:22px;font-weight:900;text-align:center}
.panel .eyebrow{display:block;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--brass-d);font-weight:700;margin-top:10px}
.panel p{font-size:14px;line-height:1.7;margin:8px 0}
.days{display:grid;gap:8px;margin-top:10px}
.day{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid #e6d3a6;border-radius:14px;padding:8px 10px}
.day b{font-size:16px}.day small{display:block;font-size:12px;color:var(--muted)}
.day .no{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;background:var(--hour);font-size:13px;line-height:1.1;text-align:center}
.day .st{color:#d09a1c;font-size:16px;letter-spacing:1px;white-space:nowrap}
.big-stars{font-size:44px;color:#e0a51f;text-align:center;letter-spacing:6px;margin:6px 0}
.legend{display:flex;justify-content:center;gap:14px;font-size:13px;font-weight:700;margin-top:6px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:22px;height:8px;border-radius:4px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes walkin{from{transform:translateX(60px);opacity:0}}
@keyframes walkout{to{transform:translateX(-80px);opacity:0}}
@keyframes takeoff{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}30%{opacity:1;transform:translate(20px,-20px) scale(.7) rotate(-8deg)}100%{opacity:0;transform:translate(260px,-260px) scale(1) rotate(-14deg)}}
@keyframes landing{0%{opacity:0;transform:translate(260px,-60px) scale(1) rotate(-6deg)}25%{opacity:1}100%{opacity:0;transform:translate(-110px,-230px) scale(.35) rotate(4deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop{animation:pop .35s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.plane{opacity:0!important}}
</style>

<main class="app" id="app">
 <header class="top">
  <button class="chip" id="menu-btn" type="button">📒 日誌</button>
  <h1 id="title">森の配送所<small>LUCA &amp; TOTO'S AIR POST</small></h1>
  <button class="chip" id="voice-btn" type="button" aria-pressed="true">🔊 こえ</button>
 </header>
 <div class="parcels" id="parcels" aria-label="今日の荷物"></div>
 <div class="toto-row"><img id="toto-face" alt="トトじい"><div class="bubble" id="toto-say" aria-live="polite"></div></div>
 <section class="task" id="task" aria-live="polite"></section>
 <div class="dial-wrap"><svg id="dial" viewBox="-160 -160 320 320" role="img" aria-label="魔法の時計"></svg><img class="plane" id="plane" alt=""></div>
 <div class="readout" id="readout" aria-live="polite"></div>
 <div class="actions" id="actions"></div>
 <div class="helper"><button type="button" id="hint-btn"><img id="hint-face" alt="">トトじいに聞く</button></div>
</main>

<div class="sheet" id="sheet" hidden><div class="card" id="sheet-card"></div></div>

<div class="overlay" id="menu">
 <div class="panel">
  <div class="scene"><img class="luka-plane" id="menu-plane" alt=""><img id="menu-toto" alt="トトじい"></div>
  <div class="inner">
   <span class="eyebrow">配達日誌 ・ 森の配送所</span>
   <h2>空のとけい便、開店じゃ！</h2>
   <p>魔法の時計には、ふたりの係がいるんじゃ。<b style="color:var(--hour)">時の針（短い針）</b>は何時か、<b style="color:var(--minute)">分の針（長い針）</b>は何分かを受けもっておる。</p>
   <div class="legend"><span><i style="background:var(--hour)"></i>時の針</span><span><i style="background:var(--minute)"></i>分の針</span></div>
   <div class="days" id="days"></div>
   <p style="font-size:12px;color:var(--muted);text-align:center">お客さんは急がないよ。ゆっくり針を合わせてね。</p>
  </div>
 </div>
</div>

<div class="overlay" id="result" hidden>
 <div class="panel" id="result-panel"></div>
</div>

<script>
const GEM_IMG=__GEMS__;      // index 1..12 → gem artwork with its numeral
const PEOPLE=__PEOPLE__;     // [{name,img}]
const ART=__ART__;           // {toto,depot,plane}
// Miracle Mine gem colours; index is the hour (12 uses index 0).
const GEM=['#eee9dc','#1468c1','#f1c84a','#c24627','#087c61','#b96a11','#9cdbeb','#343e89','#b64276','#b3a1e6','#83cfb5','#dc9656'];
const HOUR='#1f6f72',MINUTE='#c0592b';
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const hourOf=t=>Math.floor(((t%720)+720)%720/60)||12;
const minOf=t=>((Math.round(t)%60)+60)%60;
const ms=t=>(((t%720)+720)%720);
const text=(h,m)=>`${h}時${m?`${m}分`:''}`;
const html=(h,m)=>`<span class="t-h">${h}時</span>${m===null?'':m?`<span class="t-m">${m}分</span>`:'<span class="t-m">ちょうど</span>'}`;
const nextH=h=>h%12+1,prevH=h=>(h+10)%12+1;
document.documentElement.style.setProperty('--depot',`url(${ART.depot})`);
for(const id of ['toto-face','hint-face','menu-toto'])$(id).src=ART.toto;
$('plane').src=ART.plane;$('menu-plane').src=ART.plane;

// Six days at the forest depot: meet each hand alone, then put them together.
const DAYS=[
 {title:'はじめての受付',note:'時の針だけで「◯時ごろ」',hour:true,minute:false,labels:true,step:60,drag:'hour',
  intro:'今日は<b class="h">時の針</b>だけ動かすぞ。時の針がいる<b class="h">宝石のへや</b>が、何時かを教えてくれるんじゃ。',qs:['readRoom','setRoom','readRoom','setRoom','readRoom']},
 {title:'ちょうどの便',note:'分の針がてっぺんなら「ちょうど」',hour:true,minute:true,labels:true,step:60,drag:'hour',exact:true,
  intro:'<b class="m">分の針</b>がてっぺんの12にいたら「<b class="m">ちょうど</b>」の便じゃ。時の針をへやの入口に合わせよう。',qs:['setExact','readHM','setExact','readHM','setExact']},
 {title:'分の針のしごと',note:'分の針は外がわの数字を読む',hour:false,minute:true,labels:false,step:5,drag:'minute',
  intro:'今日は<b class="m">分の針</b>の番じゃ。長い針は、時計の<b class="m">外がわの数字</b>を読む。5、10、15…と進むぞ。',qs:['readMin','setMin','readMin','setMin','readMin']},
 {title:'半の便',note:'30分は、時の針がへやのまん中',hour:true,minute:true,labels:true,step:30,drag:'both',
  intro:'「半」は<b class="m">30分</b>。分の針が下の6にいるとき、<b class="h">時の針</b>はへやのまん中にいるんじゃ。',qs:['setHM','readHM','setHM','readHM','setHM']},
 {title:'5分きざみの便',note:'時の針はへや、分の針は外の数字',hour:true,minute:true,labels:true,step:5,drag:'both',
  intro:'いそがしくなってきたのう。<b class="h">時の針はへや</b>、<b class="m">分の針は外の数字</b>。ふたりの係を分けて読むんじゃ。',qs:['setHM','readHM','setHM','readHM','setHM','readHM']},
 {title:'ひとりで受付',note:'へやの数字はしまっておくよ',hour:true,minute:true,labels:false,step:5,drag:'both',
  intro:'今日はへやの数字をしまっておくぞ。宝石の色と針をよく見れば、ルカならだいじょうぶじゃ。',qs:['readHM','readHM','setHM','readHM','readHM','setHM']}
];
const ASKS=['{t}に とどけてね！','{t}に おねがい！','{t}に まにあうかな？','{t}の便に のせてください'];
let day=null,di=0,qi=0,q=null,t=0,mistakes=0,hints=0,tries=0,answered=false,results=[],voice=true,drag=null,ghost=null,helped=false;
let best={};try{best=JSON.parse(localStorage.getItem('clock-lesson-stars')||'{}');}catch{}
const toto=s=>{$('toto-say').innerHTML=s;};

// ---------- parcels ----------
function lateMinute(step){const pool=step>=30?[0,30]:[5,10,15,20,25,30,35,40,45,50,55];return Math.random()<.5?pick(pool.filter(m=>m>=40)):pick(pool);}
function make(kind){
 const h=1+rnd(12),step=day.step;
 if(kind==='readRoom'){const m=pick([10,20,35,45,50,55]);return {kind,read:true,h,m,answer:`${h}`,options:shuffle([h,nextH(h),prevH(h)]).map(x=>({key:`${x}`,label:`${x}時ごろ`,gem:x}))};}
 if(kind==='setRoom')return {kind,read:false,h,m:null,start:ms((h+4+rnd(6))*60+25)};
 if(kind==='setExact')return {kind,read:false,h,m:0,start:ms((h+3+rnd(7))*60)};
 if(kind==='readMin'){const m=5*(1+rnd(11));const opts=[m,m/5,m+(m<55?5:-5)];return {kind,read:true,h:null,m,answer:`${m}`,options:shuffle(opts).map(x=>({key:`${x}`,label:`${x}分`}))};}
 if(kind==='setMin'){const m=5*(1+rnd(11));return {kind,read:false,h:null,m,start:ms(rnd(12)*60+((m+30)%60))};}
 const m=step===60?0:step===30?pick([0,30]):lateMinute(step);
 if(kind==='readHM'){
  // Tempting wrong tags: the next hour (hour hand past the numeral) and the numeral read as minutes.
  const opts=[{h,m},{h:nextH(h),m},m?{h,m:m/5!==m&&Number.isInteger(m/5)?m/5:(m+5)%60}:{h:prevH(h),m}];
  const seen=new Set();const options=shuffle(opts.filter(o=>{const k=`${o.h}:${o.m}`;if(seen.has(k))return false;seen.add(k);return true;})).map(o=>({key:`${o.h}:${o.m}`,label:text(o.h,o.m)||`${o.h}時`}));
  return {kind,read:true,h,m,answer:`${h}:${m}`,options};
 }
 return {kind:'setHM',read:false,h,m,start:ms((h+4+rnd(6))*60+(m+25)%60)};
}

// ---------- the dial ----------
const P=(deg,r)=>[Math.sin(deg*Math.PI/180)*r,-Math.cos(deg*Math.PI/180)*r];
function wedge(a0,a1,r){const [x0,y0]=P(a0,r),[x1,y1]=P(a1,r);return `M0 0L${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}Z`;}
function buildDial(){
 let s=`<circle r="156" class="rim"/><circle r="146" class="minring"/>`;
 for(let i=0;i<60;i++){const big=i%5===0,[x0,y0]=P(i*6,big?128:133),[x1,y1]=P(i*6,145);s+=`<line class="mintick${big?' big':''}" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`;}
 s+=`<g id="minnums">`;for(let i=0;i<12;i++){const [x,y]=P(i*30,137);s+=`<text class="minnum" data-min="${i*5}" x="${x}" y="${y}">${i*5}</text>`;}s+=`</g>`;
 s+=`<circle r="126" class="face"/><g id="rooms">`;
 for(let n=0;n<12;n++){s+=`<path class="room" data-room="${n}" d="${wedge(n*30,n*30+30,125)}" fill="${GEM[n]}" fill-opacity=".22"/>`;}
 s+=`</g><g id="edges">`;for(let n=0;n<12;n++){const [x0,y0]=P(n*30,20),[x1,y1]=P(n*30,125);s+=`<line class="edge" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`;}s+=`</g>`;
 s+=`<g id="roomlabels">`;for(let n=0;n<12;n++){const [x,y]=P(n*30+15,72);s+=`<text class="roomlabel" data-room="${n}" x="${x}" y="${y}">${n||12}</text>`;}s+=`</g>`;
 for(let n=1;n<=12;n++){const [x,y]=P(n*30,104);s+=`<image href="${GEM_IMG[n]}" x="${x-17}" y="${y-17}" width="34" height="34"/>`;}
 s+=`<g id="ghost" class="ghost hidden"><line id="gh" class="hand-h" x1="0" y1="0" x2="0" y2="-62" stroke="${HOUR}"/><line id="gm" class="hand-m" x1="0" y1="0" x2="0" y2="-112" stroke="${MINUTE}"/></g>`;
 s+=`<g id="hm"><line class="hand-m" x1="0" y1="14" x2="0" y2="-112"/><g class="badge" transform="translate(0 -100)"><circle r="11" fill="${MINUTE}"/><text>分</text></g></g>`;
 s+=`<g id="hh"><line class="hand-h" x1="0" y1="10" x2="0" y2="-60"/><g class="badge" transform="translate(0 -50)"><circle r="13" fill="${HOUR}"/><text>時</text></g></g>`;
 s+=`<circle r="7" class="pin"/>`;
 $('dial').innerHTML=s;
}
function draw(){
 const L=day,room=Math.floor(ms(t)/60);
 $('hh').setAttribute('transform',`rotate(${ms(t)/2})`);$('hm').setAttribute('transform',`rotate(${(ms(t)%60)*6})`);
 $('hh').classList.toggle('hidden',!L.hour);$('hm').classList.toggle('hidden',!L.minute);
 $('minnums').classList.toggle('hidden',!L.minute);
 for(const r of document.querySelectorAll('.room')){const on=L.hour&&Number(r.dataset.room)===room;r.setAttribute('fill-opacity',L.hour?(on?.8:.24):.12);}
 for(const l of document.querySelectorAll('.roomlabel')){const on=Number(l.dataset.room)===room;l.classList.toggle('on',on&&L.hour);l.style.opacity=L.labels&&L.hour?(on?1:.55):0;}
 const mm=minOf(t);for(const n of document.querySelectorAll('.minnum'))n.classList.toggle('on',Number(n.dataset.min)===mm&&L.minute);
 $('ghost').classList.toggle('hidden',ghost===null);
 if(ghost!==null){$('gh').setAttribute('transform',`rotate(${ms(ghost)/2})`);$('gm').setAttribute('transform',`rotate(${minOf(ghost)*6})`);$('gh').classList.toggle('hidden',!L.hour);$('gm').classList.toggle('hidden',!L.minute);}
 // While setting, the child sees what the hands say; while reading, nothing gives the answer away.
 const ro=$('readout');
 if(q&&!q.read&&!answered){const parts=[];if(L.hour)parts.push(`<span class="rh">時の針 → ${hourOf(t)}のへや</span>`);if(L.minute)parts.push(`<span class="rm">分の針 → ${mm}分</span>`);ro.innerHTML=parts.join('');}
 else ro.innerHTML='';
}
// Drag the hand you grab: near the centre it is the short hand, further out the long hand.
function angleOf(e){const b=$('dial').getBoundingClientRect(),x=e.clientX-b.left-b.width/2,y=e.clientY-b.top-b.height/2;return {a:(Math.atan2(x,-y)*180/Math.PI+360)%360,r:Math.hypot(x,y)/(b.width/2)*160};}
$('dial').addEventListener('pointerdown',e=>{
 if(!q||q.read||answered)return;const {a,r}=angleOf(e);
 let hand=day.drag;if(hand==='both')hand=r<72?'hour':'minute';
 drag={hand,last:a};$('dial').setPointerCapture(e.pointerId);$('dial').classList.add('drag');move(a);
});
$('dial').addEventListener('pointermove',e=>{if(drag)move(angleOf(e).a);});
const end=()=>{if(!drag)return;drag=null;$('dial').classList.remove('drag');
 if(day.drag!=='hour'||day.exact)t=Math.round(t/day.step)*day.step;draw();};
$('dial').addEventListener('pointerup',end);$('dial').addEventListener('pointercancel',end);
function move(a){
 const before=t;
 if(drag.hand==='hour'){
  if(day.exact)t=Math.floor(a/30)*60;                    // snaps into a room at "ちょうど"
  else if(!day.minute)t=a*2;                             // the short hand alone glides freely
  else t=Math.floor(a/30)*60+minOf(t);                   // keep the minutes, change the room
 }else{let d=a-drag.last;if(d>180)d-=360;if(d<-180)d+=360;t=ms(t+d/6);}  // the long hand pulls the short hand along
 drag.last=a;
 if(Math.floor(ms(before)/60)!==Math.floor(ms(t)/60))tone(740,.06);else if(Math.round(before/5)!==Math.round(t/5)&&drag.hand==='minute')tone(1100,.02,.03);
 draw();
}

// ---------- sound, voice and planes ----------
let ac=null;
function tone(f,d=.1,g=.07){try{ac??=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;o.type='triangle';v.gain.setValueAtTime(g,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch{}}
function say(s){if(!voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.95;speechSynthesis.speak(u);}catch{}}
$('voice-btn').onclick=()=>{voice=!voice;$('voice-btn').textContent=voice?'🔊 こえ':'🔈 こえ';$('voice-btn').setAttribute('aria-pressed',String(voice));};
function fly(kind){const p=$('plane');p.className='plane';void p.offsetWidth;p.classList.add(kind);}

// ---------- the working day ----------
const spoken=(h,m)=>`${h}じ${m?`${m}ふん`:'ちょうど'}`;
const tagOf=q=>q.kind==='setMin'?`<span class="t-m">${q.m}分</span>`:q.kind==='setRoom'?`<span class="t-h">${q.h}時</span>ごろ`:html(q.h,q.m);
function startDay(i){
 di=i;day=DAYS[i];qi=0;mistakes=0;hints=0;results=[];$('menu').hidden=true;$('result').hidden=true;
 $('title').innerHTML=`森の配送所 ${i+1}日目<small>${day.title}</small>`;
 ask(true);
}
function ask(first=false){
 q=make(day.qs[qi]);tries=0;answered=false;helped=false;ghost=null;$('sheet').hidden=true;
 const task=$('task');task.className='task';void task.offsetWidth;task.classList.add('arrive');
 if(q.read){
  t=q.h===null?rnd(12)*60+q.m:ms(q.h*60+q.m);
  // Every choice is a customer waiting for their parcel; the plane's clock tells whose it is.
  const faces=shuffle(PEOPLE.slice());q.options.forEach((o,i)=>o.who=faces[i]);
  q.owner=q.options.find(o=>o.key===q.answer).who;
  task.innerHTML=`<img src="${ART.plane}" alt=""><div class="say"><div class="who">✈️ 配達の便が帰ってきた</div><div class="line">荷物に時計の刻印がついてるよ。だれの荷物かな？</div></div>`;
  $('actions').innerHTML=`<div class="choices">${q.options.map(o=>`<button class="choice" data-key="${o.key}" type="button"${o.gem?` style="border-color:${GEM[o.gem%12]}"`:''}><img src="${o.who.img}" alt=""><small>${o.who.name}</small><span>${o.label}</span></button>`).join('')}</div>`;
  for(const b of document.querySelectorAll('.choice'))b.onclick=()=>choose(b);
  fly('home');
  toto(first?day.intro:q.kind==='readMin'?'<b class="m">分の針</b>がさしておる外の数字を見るんじゃ。':q.kind==='readRoom'?'<b class="h">時の針</b>は、どの宝石のへやにおるかのう？':'時の針のへやと、分の針の外の数字。順番に見てみよう。');
  say(first?'':'だれの にもつかな？');
 }else{
  t=q.start;const who=PEOPLE[qi%PEOPLE.length];q.who=who;
  const spokenTag=q.kind==='setMin'?`${q.m}ふん`:q.kind==='setRoom'?`${q.h}じごろ`:spoken(q.h,q.m);
  const line=pick(ASKS).replace('{t}',q.kind==='setMin'?`${q.m}分`:q.kind==='setRoom'?`${q.h}時ごろ`:text(q.h,q.m)||`${q.h}時`);
  task.innerHTML=`<img src="${who.img}" alt=""><div class="say"><div class="who">${who.name}</div><div class="line">${line}</div><div class="tag">${tagOf(q)}</div></div>`;
  $('actions').innerHTML=`<button class="stamp" id="stamp" type="button">刻印して 飛ばす ✈️</button>`;$('stamp').onclick=submit;
  $('plane').className='plane';
  toto(first?day.intro:q.kind==='setMin'?'<b class="m">分の針</b>を、荷札の数字に合わせるんじゃ。':q.kind==='setRoom'?`<b class="h">時の針</b>を <b class="h">${q.h}のへや</b> に入れておくれ。`:'針を荷札の時刻に合わせたら、刻印じゃ！');
  say(spokenTag);
 }
 parcels();draw();
}
function parcels(){$('parcels').innerHTML=day.qs.map((_,i)=>`<i class="${i<qi?(results[i]?'done':'help'):i===qi?'now':''}"></i>`).join('');}
// Toto reads each hand in turn: which room the short hand is in, which number the long hand points to.
function steps(time,L=day){
 const h=hourOf(time),m=minOf(time),out=[];
 if(L.hour)out.push(`<div>時の針は <b class="h">${h}のへや</b> → <b class="h">${h}時</b></div>`);
 if(L.minute)out.push(`<div>分の針は <b class="m">${m?`${m/5}`:'12'}</b> → <b class="m">${m?`${m}分`:'ちょうど'}</b></div>`);
 out.push(`<div class="sum">だから ${L.hour&&L.minute?html(h,m):L.hour?`<span class="t-h">${h}時</span>`:`<span class="t-m">${m}分</span>`}じゃ！</div>`);
 return out.join('');
}
function correct(){
 if(q.kind==='setRoom')return hourOf(t)===q.h;
 if(q.kind==='setMin')return minOf(t)===q.m;
 return hourOf(t)===q.h&&minOf(t)===q.m;
}
function ghostTime(){return q.kind==='setMin'?(Math.floor(ms(t)/60)*60+q.m):q.kind==='setRoom'?q.h*60+30:ms(q.h*60+q.m);}
function submit(){
 if(answered)return;const ok=correct();tries++;
 if(ok){finishQ();return;}
 mistakes++;tone(200,.2,.08);
 const wrongHour=day.hour&&q.h!==null&&hourOf(t)!==q.h,wrongMin=day.minute&&q.m!==null&&minOf(t)!==q.m;
 const why=[wrongHour?`時の針は いま <b class="h">${hourOf(t)}のへや</b> におるぞ。<b class="h">${q.h}のへや</b>に入れておくれ。`:'',wrongMin?`分の針は いま <b class="m">${minOf(t)}分</b> じゃ。<b class="m">${q.m}分</b>は外の数字の<b class="m">${q.m}</b>じゃよ。`:''].filter(Boolean).join('<br>');
 if(tries>=2){ghost=ghostTime();helped=true;draw();}
 sheet('おっと、まだ飛ばせんぞ',`<div>${why}</div>${tries>=2?'<div>点線の針のところに、わしが印をつけておいたぞ。</div>':''}`,'もういちど','ng');
 $('sheet-go').onclick=()=>{$('sheet').hidden=true;};say(tries>=2?'てんせんの はりを みてごらん':'おっと、もういちど');
}
function choose(b){
 if(answered)return;const ok=b.dataset.key===q.answer;tries++;
 if(ok){b.classList.add('right');finishQ();return;}
 mistakes++;b.classList.add('wrong');b.disabled=true;tone(200,.2,.08);
 const [hh]=b.dataset.key.split(':').map(Number);
 let why='';
 if(q.kind==='readRoom')why=`時の針は、宝石の <b class="h">${q.h}</b> と <b class="h">${nextH(q.h)}</b> のあいだ。<b class="h">${q.h}のへや</b>の色を見てごらん。`;
 else if(q.kind==='readMin')why=`分の針がさす外の数字を見るんじゃ。宝石の <b class="m">${q.m/5}</b> のところは <b class="m">${q.m}分</b>じゃよ。`;
 else if(hh!==q.h)why=`時の針は、まだ <b class="h">${nextH(q.h)}</b> をこえておらん。<b class="h">${q.h}のへや</b>におるのう。`;
 else why=`分の針は外の数字で読むんじゃ。<b class="m">${q.m?q.m/5:12}</b> のところは <b class="m">${q.m?`${q.m}分`:'ちょうど'}</b>。`;
 const who=[...document.querySelectorAll('.choice')].indexOf(b);
 sheet(`${q.options[who].who.name}の荷物じゃないみたい`,`<div>${why}</div>`,'もういちど えらぶ','ng');
 $('sheet-go').onclick=()=>{$('sheet').hidden=true;};say('おっと、ちがうみたい');
}
function finishQ(){
 answered=true;results[qi]=tries===1&&!helped;draw();tone(880,.12);setTimeout(()=>tone(1320,.18),120);
 const h=hourOf(t),m=minOf(t),last=qi+1>=day.qs.length;
 const said=day.hour&&day.minute?spoken(h,m):day.hour?`${h}じ`:`${m}ふん`;
 if(q.read){
  sheet(`${q.owner.name}の荷物じゃ！`,steps(t),last?'今日の日誌をつける':'つぎの便へ','ok');
  $('task').innerHTML=`<img src="${q.owner.img}" alt=""><div class="say"><div class="who">${q.owner.name}</div><div class="thanks">とどいた！ ありがとう！</div></div>`;
  say(`${said}。${q.owner.name}の にもつだ！`);
 }else{
  fly('go');$('task').querySelector('.line').outerHTML=`<div class="thanks">いってらっしゃーい！</div>`;
  sheet('ぴったりじゃ！ 飛んでいけ〜',steps(t),last?'今日の日誌をつける':'つぎのお客さん','ok');
  say(`${said}。いってらっしゃい！`);
 }
 results[qi]=results[qi];parcels();
 $('sheet-go').onclick=()=>{qi++;const task=$('task');task.classList.add('leave');setTimeout(()=>{if(qi<day.qs.length)ask();else finishDay();},q.read?0:350);};
}
function sheet(title,body,go,cls=''){
 $('sheet-card').innerHTML=`<img src="${ART.toto}" alt=""><div class="body"><div class="name">トトじい</div><h2 class="${cls}">${title}</h2><div class="steps">${body}</div></div><div class="row"><button class="${cls==='ok'?'next':'again'}" id="sheet-go" type="button">${go}</button></div>`;
 $('sheet').hidden=false;$('sheet-go').focus();
}
function finishDay(){
 const lost=mistakes+hints,stars=lost===0?3:lost<=2?2:1;best[di]=Math.max(best[di]||0,stars);try{localStorage.setItem('clock-lesson-stars',JSON.stringify(best));}catch{}
 const alone=results.filter(Boolean).length;
 $('sheet').hidden=true;
 $('result-panel').innerHTML=`<div class="scene"><img class="luka-plane" src="${ART.plane}" alt=""><img src="${ART.toto}" alt=""></div><div class="inner"><span class="eyebrow">配達日誌 ・ ${di+1}日目</span><h2>今日の配達、おしまい！</h2><div class="big-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p style="text-align:center">${day.qs.length}こ の荷物を ぜんぶ届けたよ<br><small>ひとりで ぴったり：${alone}こ</small></p><p style="text-align:center;font-weight:700">トトじい「${stars===3?'見事じゃ！ 時の針と分の針、すっかり仲良しじゃのう。':stars===2?'よう届けたのう。針の係、だいぶ見えてきたぞ。':'今日もよう働いた！ 明日もいっしょに届けような。'}」</p><div class="days"><button class="next" id="again-d" type="button">この日をもういちど</button>${di+1<DAYS.length?`<button class="next" id="next-d" type="button" style="background:${MINUTE}">${di+2}日目へ ▸</button>`:''}<button class="again" id="list-d" type="button">日誌にもどる</button></div></div>`;
 $('result').hidden=false;$('again-d').onclick=()=>startDay(di);$('list-d').onclick=showMenu;if($('next-d'))$('next-d').onclick=()=>startDay(di+1);
 say(stars===3?'みごとじゃ！':'よう とどけたのう');
}
$('hint-btn').onclick=()=>{
 if(!q||answered)return;hints++;helped=true;
 if(q.read)sheet('どれ、わしが見てみよう',`${day.hour&&q.h!==null?`<div><b class="h">時の針</b>がいる宝石のへやを見るんじゃ。宝石の数字から、つぎの宝石までがひとつのへや。</div>`:''}${day.minute?`<div><b class="m">分の針</b>は外がわの数字を読む。5、10、15…とな。</div>`:''}`,'わかった！');
 else{ghost=ghostTime();draw();sheet('どれ、わしが印をつけよう','<div>点線の針のところに合わせてごらん。</div>','わかった！');}
 $('sheet-go').onclick=()=>{$('sheet').hidden=true;};
};
function showMenu(){
 $('result').hidden=true;$('sheet').hidden=true;
 $('days').innerHTML=DAYS.map((L,i)=>`<button class="day" type="button" data-i="${i}"><span class="no" style="background:${i===2?MINUTE:HOUR}">${i+1}<br>日目</span><span><b>${L.title}</b><small>${L.note}</small></span><span class="st">${'★'.repeat(best[i]||0)}${'☆'.repeat(3-(best[i]||0))}</span></button>`).join('');
 for(const b of document.querySelectorAll('.day'))b.onclick=()=>startDay(Number(b.dataset.i));
 $('menu').hidden=false;
}
$('menu-btn').onclick=showMenu;
buildDial();day=DAYS[0];q=null;t=3*60+50;draw();showMenu();
</script>
